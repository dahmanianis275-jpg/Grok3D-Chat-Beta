<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok3D Chat — Original Beta</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0f; color: #e8e8f0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    header { position: relative; z-index: 10; padding: 16px 24px; background: rgba(10,10,20,0.75); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(120,80,255,0.25); display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.25rem; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #7c5cff, #00d4ff); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(124,92,255,0.5); }
    .badge { font-size: 0.7rem; background: linear-gradient(90deg, #7c5cff, #00d4ff); color: #0a0a0f; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
    main { position: relative; z-index: 10; flex: 1; display: flex; flex-direction: column; max-width: 860px; width: 100%; margin: 0 auto; padding: 0 16px; overflow: hidden; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 24px 8px; display: flex; flex-direction: column; gap: 20px; }
    .message { display: flex; gap: 14px; max-width: 92%; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .message.bot .avatar { background: linear-gradient(135deg, #7c5cff, #00d4ff); }
    .message.user .avatar { background: #2a2a3a; border: 1px solid rgba(255,255,255,0.1); }
    .bubble { padding: 14px 18px; border-radius: 18px; line-height: 1.55; font-size: 0.95rem; }
    .message.bot .bubble { background: rgba(30,30,50,0.85); border: 1px solid rgba(124,92,255,0.2); border-bottom-left-radius: 6px; }
    .message.user .bubble { background: linear-gradient(135deg, #5b3fd9, #3a7bd5); border-bottom-right-radius: 6px; color: white; }
    .input-area { padding: 16px 0 24px; }
    .input-wrapper { display: flex; gap: 10px; background: rgba(20,20,35,0.9); border: 1px solid rgba(124,92,255,0.35); border-radius: 16px; padding: 10px 14px; align-items: flex-end; }
    #user-input { flex: 1; background: transparent; border: none; color: #e8e8f0; font-size: 1rem; resize: none; outline: none; font-family: inherit; }
    #send-btn { width: 42px; height: 42px; border-radius: 12px; border: none; background: linear-gradient(135deg, #7c5cff, #00d4ff); color: #0a0a0f; font-size: 18px; cursor: pointer; }
    .welcome { text-align: center; padding: 40px 20px; }
    .welcome h2 { font-size: 1.6rem; margin-bottom: 10px; background: linear-gradient(90deg, #a78bfa, #67e8f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .disclaimer { text-align: center; font-size: 0.75rem; opacity: 0.5; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <header>
    <div class="logo">
      <div class="logo-icon">✦</div>
      <span>Grok3D Chat</span>
      <span class="badge">ORIGINAL</span>
    </div>
    <span style="opacity:0.7;font-size:0.85rem">v0.1.0 · Free</span>
  </header>
  <main>
    <div id="chat-messages">
      <div class="welcome" id="welcome">
        <h2>Original Grok3D Chat</h2>
        <p style="opacity:0.7;max-width:400px;margin:0 auto 12px">Simple 3D chat demo. This is AI software, not a real human.</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="Type a message…" autofocus></textarea>
        <button id="send-btn">➤</button>
      </div>
      <div class="disclaimer">Free software · Not a real human responder · Type with keyboard</div>
    </div>
  </main>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 30;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(600*3);
    for (let i=0;i<600;i++){ pos[i*3]=(Math.random()-0.5)*70; pos[i*3+1]=(Math.random()-0.5)*70; pos[i*3+2]=(Math.random()-0.5)*70; }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const particles = new THREE.Points(geo, new THREE.PointsMaterial({ size:0.12, color:0x7c5cff, transparent:true, opacity:0.7 }));
    scene.add(particles);
    function animate(){ requestAnimationFrame(animate); particles.rotation.y += 0.0008; renderer.render(scene, camera); }
    animate();
    window.addEventListener('resize', ()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });

    const messagesEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const welcome = document.getElementById('welcome');

    function addMessage(text, isUser) {
      if (welcome) welcome.remove();
      const div = document.createElement('div');
      div.className = 'message ' + (isUser ? 'user' : 'bot');
      div.innerHTML = '<div class="avatar">' + (isUser ? 'U' : '✦') + '</div><div class="bubble">' + text + '</div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function send() {
      const t = inputEl.value.trim();
      if (!t) return;
      addMessage(t, true);
      inputEl.value = '';
      setTimeout(() => {
        addMessage("This is the original simple version. I'm software, not a real human. Try the main index.html for the full 3D face + voice assistant.", false);
      }, 600);
    }
    sendBtn.onclick = send;
    inputEl.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
  </script>
</body>
</html>
